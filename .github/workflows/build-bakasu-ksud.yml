name: Build BakaSU ksud & Dump KO
on:
  workflow_dispatch:
    inputs:
      kmi:
        description: KMI
        default: android15-6.6
        required: true
      arch:
        description: arch
        default: aarch64
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y just clang llvm bc bison flex libelf-dev libssl-dev python3

      - name: Build ksud
        run: just ks ${{ github.event.inputs.kmi }} ${{ github.event.inputs.arch }}

      - name: Extract ko from ksud
        env:
          OUTNAME: lkm-${{ github.event.inputs.arch }}-${{ github.event.inputs.kmi }}_kernelsu.ko
        run: |
          python3 -c "
import sys
with open('build/ksud','rb') as f:
    raw = f.read()
s = raw.find(b'KSU_LKM_START')
e = raw.find(b'KSU_LKM_END', s)
if s < 0 or e < 0:
    print('ERROR: marker not found')
    exit(1)
with open('${OUTNAME}','wb') as fo:
    fo.write(raw[s+len(b'KSU_LKM_START'):e])
print('ok')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ github.event.inputs.arch }}-${{ github.event.inputs.kmi }}_kernelsu
          path: lkm-${{ github.event.inputs.arch }}-${{ github.event.inputs.kmi }}_kernelsu.ko

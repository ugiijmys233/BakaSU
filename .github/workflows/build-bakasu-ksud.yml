name: Build BakaSU ksud & Dump KO
on:
  workflow_dispatch:
    inputs:
      kmi:
        description: KMI
        default: android15-6.6
        required: true
      arch:
        description: arch
        default: aarch64
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y just clang llvm bc bison flex libelf-dev libssl-dev python3

      - name: Build ksud
        run: just ks ${{ github.event.inputs.kmi }} ${{ github.event.inputs.arch }}

      - name: Extract ko from ksud
        run: |
          python3 -c "
raw = open('build/ksud','rb').read()
s = raw.find(b'KSU_LKM_START')
e = raw.find(b'KSU_LKM_END', s)
if s < 0 or e < 0:
    print('ERROR: KSU_LKM marker not found inside ksud')
    exit(1)
out_name = f'lkm-{github.event.inputs.arch}-{github.event.inputs.kmi}_kernelsu.ko'
open(out_name,'wb').write(raw[s+len(b'KSU_LKM_START'):e])
print(f'Extracted OK -> {out_name}')
"
        env:
          GITHUB_CONTEXT: ${{ toJson(github.event.inputs) }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ github.event.inputs.arch }}-${{ github.event.inputs.kmi }}_kernelsu
          path: lkm-${{ github.event.inputs.arch }}-${{ github.event.inputs.kmi }}_kernelsu.ko
